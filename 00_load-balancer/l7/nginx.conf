events {
	worker_connections 1024;
}

http {
	upstream v1 {
		server v1_server:8080;
	}
	upstream v2 {
		server v2_server:8080;
	}
	upstream static_backend {
		server static_server:8080;
	}
	server {
		listen 80;
		location /v1/api {
			proxy_pass http://v1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
		location /v2/api {
			proxy_pass http://v2;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
		location /static {
			proxy_pass http://static_backend;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}
