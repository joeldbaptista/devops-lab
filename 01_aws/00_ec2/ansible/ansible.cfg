[defaults]
inventory            = inventory.ini
remote_user          = ec2-user
private_key_file     = ~/.ssh/devops-lab-ec2
host_key_checking    = False
interpreter_python   = auto_silent
# The community.general.yaml callback was removed in that collection's version
# 12.0.0. The built-in callback produces the same layout through result_format.
stdout_callback      = default
result_format        = yaml
retry_files_enabled  = False
roles_path           = roles

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
