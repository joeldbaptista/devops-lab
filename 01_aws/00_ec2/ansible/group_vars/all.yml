---
# Utilities installed on every host. curl is deliberately absent, because
# Amazon Linux 2023 ships curl-minimal and installing curl conflicts with it.
common_packages:
  - git
  - vim
  - tmux
  - htop
  - jq
  - unzip
  - tar
  - rsync

# Users added to the docker group, so they run docker without sudo.
docker_users:
  - ec2-user

# Upgrade every installed package before the rest of the run. Off by default,
# because it is slow and it can replace the running kernel.
upgrade_all_packages: false
