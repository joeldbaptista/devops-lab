---
- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

# Everything below depends on the package actually being on disk. Check mode
# never installs it, so the service unit and the docker group do not exist and
# each of these tasks would fail on a bare host. The block is skipped as a
# whole, which keeps `make check` usable as a dry run.
- name: Configure Docker once the package is installed
  when: not ansible_check_mode
  block:

    - name: Enable and start the Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Add the login users to the docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"

    # A new supplementary group only takes effect in a new login session, so
    # the current SSH connection must be dropped for the docker group to apply.
    - name: Drop the SSH connection so the new group membership takes effect
      ansible.builtin.meta: reset_connection

    - name: Confirm the daemon answers and ec2-user may reach it without sudo
      ansible.builtin.command: docker version
      become: false
      changed_when: false
      register: docker_check

    - name: Report the Docker version
      ansible.builtin.debug:
        msg: >-
          {{ docker_check.stdout_lines | select('search', 'Version') | list }}
